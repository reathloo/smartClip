name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Resolve dependencies
        run: swift package resolve
      - name: Run SmartClip checks
        run: zsh scripts/test.sh
      - name: Check scripts and whitespace
        run: |
          zsh -n scripts/*.sh
          git diff --check
