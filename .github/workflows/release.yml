name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  checks: read
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require tested main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]] || {
            echo "Release tags must point to the current main commit." >&2
            exit 1
          }
          result="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
            --jq '[.check_runs[] | select(.name == "test" and .app.slug == "github-actions" and .conclusion == "success")] | length')"
          [[ "$result" -ge 1 ]] || {
            echo "A successful CI/test check is required for this commit." >&2
            exit 1
          }

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate release configuration
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          [[ -n "$SPARKLE_PRIVATE_KEY" ]] || {
            echo "SPARKLE_PRIVATE_KEY is not configured." >&2
            exit 1
          }
          version="${GITHUB_REF_NAME#v}"
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          [[ "$version" == "$app_version" || "$version" == "$app_version"-* ]] || {
            echo "Tag $GITHUB_REF_NAME does not match app version $app_version." >&2
            exit 1
          }

      - name: Build and verify DMG
        run: zsh scripts/package-release.sh "$GITHUB_REF_NAME"

      - name: Generate signed update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          dmg="$(find dist/release -maxdepth 1 -name '*.dmg' -print -quit)"
          zsh scripts/generate-appcast.sh "$GITHUB_REF_NAME" "$dmg"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          prerelease=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=(--prerelease)
          if [[ -f "$notes" ]]; then
            gh release create "$GITHUB_REF_NAME" dist/release/* dist/update-feed/appcast.xml \
              --title "SmartClip $GITHUB_REF_NAME" --notes-file "$notes" "${prerelease[@]}"
          else
            gh release create "$GITHUB_REF_NAME" dist/release/* dist/update-feed/appcast.xml \
              --title "SmartClip $GITHUB_REF_NAME" --generate-notes "${prerelease[@]}"
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/update-feed
      - name: Publish Sparkle feed
        id: deployment
        uses: actions/deploy-pages@v4
